name: Desplegar en el servidor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desplegar-studentscope-mj-web
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: [self-hosted, studentscope-mj-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Copiar el codigo al servidor
        run: |
          destino="$HOME/studentscope-mj/studentscope-mj-frontend"
          mkdir -p "$destino"
          rsync -a --delete \
            --include='/index.html' --include='/css/***' \
            --include='/js/***' --include='/json/***' \
            --exclude='*' ./ "$destino/"

      - name: Desplegar
        run: $HOME/studentscope-mj/desplegar.sh web
